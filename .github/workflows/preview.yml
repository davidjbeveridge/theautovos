name: Owner preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical source and generated pages
        run: node scripts/verify.mjs
      - name: Verify intake, release guards and search metadata
        run: node --test tests/*.test.mjs
      - name: Verify production and preview metadata artifacts
        run: |
          node scripts/build-site.mjs
          node scripts/build-production.mjs
          node scripts/build-hosted-demo.mjs
          node scripts/verify-metadata.mjs
      - name: Package owner-facing preview
        run: node scripts/package-preview.mjs
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload preview
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
