  "id": "split-header",
  "semanticName": "Split image header",
  "purpose": "Establish page identity and purpose beside a meaningful photograph.",
  "contentSlots": [
    {
      "id": "label",
      "semanticKind": "label",
      "required": true,
      "overflowPolicy": "wrap"
    },
    {
      "id": "title",
      "semanticKind": "heading",
      "required": true,
      "overflowPolicy": "wrap"
    },
    {
      "id": "description",
      "semanticKind": "text",
      "required": true,
      "overflowPolicy": "wrap"
    },
    {
      "id": "image",
      "semanticKind": "image",
      "required": true,
      "overflowPolicy": "preserve"
    }
  ],
  "presentationVariables": [
    "color.ink",
    "color.inverse",
    "space.section",
    "layout.max"
  ],
  "x-autovos": {
    "note": "Text and one H1 precede the image in DOM order. Place copy beside the image on wide screens and stack text before image on compact screens. Do not crop meaningful detail."
